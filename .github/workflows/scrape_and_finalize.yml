name: Nellis Auction Legacy SQLite Export (Manual Only)

# NOTE: Replaced by daily_scrape.yml (Cloudflare R2 Parquet Data Lake).
# Schedule & git-push of nellis_auctions.db removed because SQLite exceeded GitHub's 100 MB limit.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'scrape'
          - 'finalize'
      locations:
        description: 'Locations to scrape (comma-separated)'
        required: false
        default: 'Phoenix,Mesa'
      limit:
        description: 'Item limit per location (leave blank for all)'
        required: false
        default: ''

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scraper / Finalizer
        run: |
          ACTION="${{ github.event.inputs.action || 'both' }}"
          LOCATIONS="${{ github.event.inputs.locations || 'Phoenix,Mesa' }}"
          LIMIT="${{ github.event.inputs.limit }}"

          LIMIT_FLAG=""
          if [ -n "$LIMIT" ]; then
            LIMIT_FLAG="--limit $LIMIT"
          fi

          if [ "$ACTION" = "both" ]; then
            python nellis_scraper.py --locations "$LOCATIONS" $LIMIT_FLAG --export-csv nellis_auctions.csv
            python nellis_scraper.py --finalize --export-csv nellis_auctions.csv
          elif [ "$ACTION" = "scrape" ]; then
            python nellis_scraper.py --locations "$LOCATIONS" $LIMIT_FLAG --export-csv nellis_auctions.csv
          elif [ "$ACTION" = "finalize" ]; then
            python nellis_scraper.py --finalize --export-csv nellis_auctions.csv
          fi

      - name: Upload Database & CSV Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nellis-auction-data
          path: |
            nellis_auctions.db
            nellis_auctions.csv
          retention-days: 30
