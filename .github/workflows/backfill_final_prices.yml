name: Backfill Settled Final Winning Prices

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: 'Max Parquet files to process newest-first (0 = all files)'
        required: false
        default: '0'
      workers:
        description: 'Concurrent HTTP workers'
        required: false
        default: '10'
      cooldowns:
        description: 'Max HTTP 429 cooldown cycles per run'
        required: false
        default: '45'
      reverify_all:
        description: 'Re-verify even already settled rows (true/false)'
        required: false
        default: 'false'

jobs:
  backfill-final-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Post-Close Winning Price Backfill
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          REVERIFY_ARG=""
          if [ "${{ github.event.inputs.reverify_all }}" = "true" ]; then
            REVERIFY_ARG="--reverify-all"
          fi
          python -m src.settlement \
            --max-files "${{ github.event.inputs.max_files || '0' }}" \
            --workers "${{ github.event.inputs.workers || '10' }}" \
            --cooldowns "${{ github.event.inputs.cooldowns || '45' }}" \
            --skip-v2 \
            $REVERIFY_ARG
          python -m src.compact_lake
