name: Backfill Settled Final Winning Prices

on:
  schedule:
    # Twice-daily paced post-close backfill (11:30 PM & 8:30 AM AZ MST)
    - cron: '30 6,15 * * *'
  workflow_dispatch:
    inputs:
      max_files:
        description: 'Max Parquet files to process newest-first (0 = all files)'
        required: false
        default: '0'
      workers:
        description: 'Concurrent HTTP workers'
        required: false
        default: '4'
      rate:
        description: 'Sustained max requests/sec (0 = unpaced)'
        required: false
        default: '2.5'
      max_items:
        description: 'Max unique auction lookups resolved per run (0 = unlimited)'
        required: false
        default: '35000'
      max_minutes:
        description: 'Soft wall-clock budget in minutes before compacting v2 (0 = unlimited)'
        required: false
        default: '250'
      cooldowns:
        description: 'Max HTTP 429 cooldown cycles per run'
        required: false
        default: '10'
      reverify_all:
        description: 'Re-verify even already settled rows (true/false)'
        required: false
        default: 'false'

jobs:
  backfill-final-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Post-Close Winning Price Backfill
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          REVERIFY_ARG=""
          if [ "${{ github.event.inputs.reverify_all }}" = "true" ]; then
            REVERIFY_ARG="--reverify-all"
          fi
          python -m src.settlement \
            --max-files "${{ github.event.inputs.max_files || '0' }}" \
            --workers "${{ github.event.inputs.workers || '4' }}" \
            --rate "${{ github.event.inputs.rate || '2.5' }}" \
            --max-items "${{ github.event.inputs.max_items || '35000' }}" \
            --max-minutes "${{ github.event.inputs.max_minutes || '250' }}" \
            --cooldowns "${{ github.event.inputs.cooldowns || '10' }}" \
            --cooldown-sec 120 \
            --skip-v2 \
            $REVERIFY_ARG
          python -m src.compact_lake
