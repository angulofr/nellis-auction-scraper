name: Nellis Auction Daily Lake Ingestion

on:
  schedule:
    # Runs 3x daily (Morning, Peak Evening Closing, and Late Night AZ MST) to keep active & closed lots fresh
    - cron: '30 2,6,15 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Item limit per location (leave blank for all ~30,000+ items)'
        required: false
        default: ''
      locations:
        description: 'Target warehouse locations'
        required: false
        default: 'Phoenix,Mesa'

jobs:
  ingest-to-lake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nellis Ingestion & Parquet R2 Loader
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi

          LOCATIONS="${{ github.event.inputs.locations || 'Phoenix,Mesa' }}"
          echo "[*] Ingesting Nellis Auction lots for $LOCATIONS..."
          python -m src.scraper --locations "$LOCATIONS" $LIMIT_ARG

      - name: Verify Data Lake via DuckDB
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "[*] Querying DuckDB directly against Cloudflare R2 Data Lake..."
          python -m src.query_lake --query condition-arbitrage
