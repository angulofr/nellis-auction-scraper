name: Compact Nellis Data Lake (v2)

on:
  schedule:
    # Weekly clean compaction Sunday 08:30 UTC (1:30 AM MST) to roll hot closes into monthly cold Parquet
    - cron: '30 8 * * 0'
  workflow_dispatch:
    inputs:
      hot_days:
        description: 'Days of recent closes retained in hot partition'
        required: false
        default: '3'

jobs:
  compact-lake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Compacted Sorted v2 Partitions & Aggregates
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m src.compact_lake --hot-days "${{ github.event.inputs.hot_days || '3' }}"
          python -m src.query_lake --query condition-arbitrage
